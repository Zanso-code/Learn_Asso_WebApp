<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />

    <!-- Les jetons de session Supabase vivent dans localStorage : sur une SPA
         statique, sans serveur à nous, le cookie httpOnly n'est pas une option.
         Cette politique réduit fortement ce que vaut un XSS — mais elle ne
         l'annule pas : la CSP ne contraint PAS la navigation, et un script
         injecté peut encore emporter un jeton dans une URL en quittant la page.
         Le durcissement réel est ailleurs (RLS, session Trésorier distincte).

         Le contenu est GÉNÉRÉ à la compilation depuis VITE_SUPABASE_URL — voir
         `securityHeaders()` dans vite.config.ts. L'hôte n'est plus écrit en
         dur : un déploiement vers un autre projet Supabase bloquait
         silencieusement tous les appels réseau.

         Deux protections ne peuvent pas voyager dans une balise <meta> — le
         navigateur les ignore — et sont émises dans `dist/_headers` :
         `frame-ancestors 'none'` et `Strict-Transport-Security`. -->
    <meta http-equiv="Content-Security-Policy" content="__CSP__" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0066ff" />
    <meta name="description" content="Gérez les membres, cotisations, dépenses et rapports d'Assemblée Générale de votre association. Simple, rapide, transparent." />

    <!-- Space Grotesk est auto-hébergée (voir src/index.css). La feuille de
         style Google était la seule dépendance réseau au premier rendu, ce qui
         n'a pas de sens dans une application conçue pour fonctionner hors
         ligne : elle bloquait l'affichage sur une connexion absente ou lente. -->
    <link
      rel="preload"
      href="/fonts/space-grotesk-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <title>AssoCaisse — Gestion d'association & ONG</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
